{% load wagtailcore_tags %}
{% if contact_page and contact_form %}
<form class="listing-contact-form" action="{% pageurl contact_page %}" method="post" id="contact-us-form">
    <div class="contact-form-intro">{{ contact_page.intro|richtext }}</div>
    {% csrf_token %}
    {% spaceless %}
    {% for field in contact_form %}
    <div class="col-md-7 contact-form__row contact-form__row--{{ field.id_for_label }}">
        <div class="form-group">
            {{ field.errors }}
            <label for="{{ field.id_for_label }}" class="contact-form__label {% if field.field.required %} contact-form__label--required {% endif %}">
                {{ field.label }}
            </label>
            <div class="form-control">
                {{ field }}
            </div>
        </div>
    </div>
    {% endfor %}
    {% endspaceless %}
    <div class="col-sm-12">
        <button type="submit" class="btn btn-primary pull-left" id="contact-us-submit"> Post Message</button>
    </div>
</form>
{% endif %}
