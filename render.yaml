# Render Blueprint (Infrastructure as Code)
# This file defines your Render services declaratively
# See: https://render.com/docs/blueprint-spec

services:
  # PostgreSQL Database
  - type: pspg
    name: localchurches-db
    databaseName: localchurches
    databaseUser: localchurches_user
    plan: starter  # Options: starter, standard, pro, pro-plus
    # For production, consider: standard or pro
    # For testing, use: starter (free tier available)
    region: oregon  # Options: oregon, frankfurt, singapore, mumbai, tokyo
    # Choose region closest to your users

  # Web Service (Django Application)
  - type: web
    name: localchurches
    env: python
    region: oregon  # Should match database region
    plan: starter  # Options: starter, standard, pro, pro-plus
    # For production, consider: standard or pro
    # For testing, use: starter (free tier available)
    buildCommand: ./build.sh
    # start.sh sets DJANGO_SETTINGS_MODULE: production on master, staging on other branches.
    # Staging uses WhiteNoise only so the lcstatic S3 bucket is never modified.
    startCommand: bash scripts/start.sh
    healthCheckPath: /
    envVars:
      # Django Settings (overridden by scripts/start.sh based on RENDER_GIT_BRANCH)
      - key: DJANGO_SETTINGS_MODULE
        value: lampstands.settings.production
      
      # Security - REQUIRED: Set these in Render dashboard after creating service
      # DO NOT commit actual secrets to git!
      - key: SECRET_KEY
        sync: false  # Must be set manually in Render dashboard
      
      # Database - Will be auto-set when database is linked
      - key: DATABASE_URL
        fromDatabase:
          name: localchurches-db
          property: connectionString
      
      # Security Settings
      - key: DEBUG
        value: "False"  # Set to "True" only for temporary debugging
      - key: ALLOWED_HOSTS
        value: "localchurches.onrender.com"  # Update with your actual domain(s), comma-separated
      
      # Logging Levels (optional - defaults to INFO)
      - key: LOG_LEVEL
        value: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
      - key: DJANGO_LOG_LEVEL
        value: "INFO"
      - key: DJANGO_REQUEST_LOG_LEVEL
        value: "WARNING"
      - key: WAGTAIL_LOG_LEVEL
        value: "INFO"
      - key: LAMPSTANDS_LOG_LEVEL
        value: "INFO"
      
      # AWS S3 Configuration (for media files)
      # Set these in Render dashboard after creating service
      - key: AWS_ACCESS_KEY_ID
        sync: false  # Must be set manually
      - key: AWS_SECRET_ACCESS_KEY
        sync: false  # Must be set manually
      - key: S3_BUCKET_NAME
        value: "lcstatic"  # Update if your bucket name is different
      
      # Email Configuration (SendGrid)
      # Set these in Render dashboard after creating service
      - key: SENDGRID_USERNAME
        sync: false  # Must be set manually
      - key: SENDGRID_PASSWORD
        sync: false  # Must be set manually
      
      # reCAPTCHA Configuration
      # Set these in Render dashboard after creating service
      - key: GOOGLE_RECAPTCHA_SITE_KEY
        sync: false  # Must be set manually
      - key: GOOGLE_RECAPTCHA_SECRET_KEY
        sync: false  # Must be set manually
      
      # Google Maps Map ID for Advanced Markers (removes deprecated Marker)
      # DEMO_MAP_ID = Google's built-in ID for testing/production
      # For a custom style create one in Cloud Console → Map Management and set it here
      - key: GOOGLE_MAPS_MAP_ID
        value: "DEMO_MAP_ID"
      
      # Wagtail Configuration
      - key: WAGTAILADMIN_BASE_URL
        value: "https://localchurches.onrender.com"  # Update with your actual domain

# Note: After deploying with this blueprint:
# 1. Go to Render dashboard → Your web service → Environment
# 2. Set all the "sync: false" variables manually (SECRET_KEY, AWS keys, SendGrid, reCAPTCHA)
# 3. Update ALLOWED_HOSTS with your actual domain(s)
# 4. Update WAGTAILADMIN_BASE_URL with your actual domain
# 5. Link the database if not auto-linked (should be automatic with this config)
#
# Branch-based settings (build.sh + scripts/start.sh):
# - master → lampstands.settings.production (S3 lcstatic used for static if AWS_* set)
# - any other branch → lampstands.settings.staging (WhiteNoise only; lcstatic never modified)
# For preview/staging deploys, S3 env vars are optional; staging ignores them.
